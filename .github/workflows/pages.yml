name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the game logic
        run: node tests/run.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the app shell is published; tests and tools stay in the repo.
          # These must match the precache list in sw.js.
          path: |
            .nojekyll
            index.html
            styles.css
            sw.js
            manifest.webmanifest
            favicon.svg
            js/
            icons/

      - id: deployment
        uses: actions/deploy-pages@v4
